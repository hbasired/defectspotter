name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Runtime requirements only: the unit tests and the app/integration tests on the shipped
      # artifacts need ONNX Runtime + NumPy, not PyTorch.
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
